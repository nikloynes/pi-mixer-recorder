<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Recorder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .status {
            text-align: center;
            margin-bottom: 30px;
        }

        .status-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
            vertical-align: middle;
        }

        .status-indicator.recording {
            background: #f44336;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .status-indicator.idle {
            background: #4CAF50;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-size: 1.2em;
            color: #666;
            vertical-align: middle;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-start {
            background: #4CAF50;
            color: white;
        }

        .btn-start:hover:not(:disabled) {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-stop {
            background: #f44336;
            color: white;
        }

        .btn-stop:hover:not(:disabled) {
            background: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3);
        }

        .recordings {
            margin-top: 30px;
        }

        .recordings h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .recording-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .recording-item {
            background: #f5f5f5;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .recording-item .filename {
            font-weight: 600;
            color: #333;
        }

        .recording-item .details {
            color: #666;
            font-size: 0.85em;
            margin-top: 5px;
        }

        .no-recordings {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Audio Recorder</h1>

        <div class="status">
            <span class="status-indicator idle" id="statusIndicator"></span>
            <span class="status-text" id="statusText">Ready</span>
        </div>

        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="startRecording()">
                Start Recording
            </button>
            <button class="btn-stop" id="stopBtn" onclick="stopRecording()" disabled>
                Stop Recording
            </button>
        </div>

        <div class="recordings">
            <h2>Recent Recordings</h2>
            <div class="recording-list" id="recordingList">
                <div class="no-recordings">No recordings yet</div>
            </div>
        </div>
    </div>

    <script>
        let isRecording = false;

        // Update status on page load and periodically
        updateStatus();
        setInterval(updateStatus, 2000);

        // Update recordings list
        updateRecordings();
        setInterval(updateRecordings, 5000);

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                isRecording = data.is_recording;

                const indicator = document.getElementById('statusIndicator');
                const statusText = document.getElementById('statusText');
                const startBtn = document.getElementById('startBtn');
                const stopBtn = document.getElementById('stopBtn');

                if (isRecording) {
                    indicator.className = 'status-indicator recording';
                    statusText.textContent = 'Recording...';
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                } else {
                    indicator.className = 'status-indicator idle';
                    statusText.textContent = 'Ready';
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                }
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }

        async function startRecording() {
            try {
                const response = await fetch('/api/start', { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    updateStatus();
                }
            } catch (error) {
                console.error('Error starting recording:', error);
                alert('Failed to start recording');
            }
        }

        async function stopRecording() {
            try {
                const response = await fetch('/api/stop', { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    updateStatus();
                    setTimeout(updateRecordings, 1000); // Refresh recordings list
                }
            } catch (error) {
                console.error('Error stopping recording:', error);
                alert('Failed to stop recording');
            }
        }

        async function updateRecordings() {
            try {
                const response = await fetch('/api/recordings');
                const data = await response.json();
                const listEl = document.getElementById('recordingList');

                if (data.recordings.length === 0) {
                    listEl.innerHTML = '<div class="no-recordings">No recordings yet</div>';
                    return;
                }

                listEl.innerHTML = data.recordings.map(rec => {
                    const size = (rec.size / 1024 / 1024).toFixed(2);
                    const date = new Date(rec.created).toLocaleString();
                    return `
                        <div class="recording-item">
                            <div class="filename">${rec.filename}</div>
                            <div class="details">${size} MB • ${date}</div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error updating recordings:', error);
            }
        }
    </script>
</body>
</html>
