[project]
name = "pi-mixer-recorder"
version = "0.1.0"
description = "Raspberry Pi audio recorder for Soundcraft mixer with Dropbox integration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "pyaudio>=0.2.14",
    "dropbox>=11.36.2",
    "pyyaml>=6.0.1",
    "RPi.GPIO>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.7.0",
    "ruff>=0.1.6",
    "types-PyYAML>=6.0.12",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pyaudio", "RPi.GPIO", "dropbox.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["config_manager", "audio_recorder", "dropbox_uploader", "gpio_controller", "web_interface"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"