[project]
name = "pi-mixer-recorder"
version = "0.1.0"
description = "Raspberry Pi audio recorder for Soundcraft mixer with Dropbox integration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "pyaudio>=0.2.14",
    "dropbox>=11.36.2",
    "pyyaml>=6.0.1",
    "loguru>=0.7.3",
    "pre-commit>=4.3.0",
    "pydantic-settings>=2.11.0",
]

[project.optional-dependencies]
hardware = [
    "RPi.GPIO>=0.7.1",
]

dev = [
    "mypy>=1.7.0",
    "ruff>=0.1.6",
    "types-PyYAML>=6.0.12",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pyaudio", "RPi.GPIO", "dropbox.*"]
ignore_missing_imports = true
[tool.ruff]
extend-exclude = ["app/migrations/versions/*.py", "docs/*.py"]
fix = true
force-exclude = true
target-version = "py312"
lint.ignore = [
    "COM812", # trailing commas (ruff-format recommended)
    "D104", # module docstring
    "D203", # no-blank-line-before-class
    "D205", # missing-blank-line-after-summary
    "D212", # multi-line-summary-first-line
    "D403", # forcing upper-case - feel free to change @harry
    "D407", # removed dashes lines under sections
    "D417", # argument description in docstring (unreliable)
    "E501", # long lines, remove later on.
    "FIX002", # implicit trust that TODOs are not trivial, or else they would be fixed
    "ISC001", # simplify implicit str concatenation (ruff-format recommended)
    "T201", # allows print - we use it in CLI component of app
    "TD002", # name for TO DO
    "TD003", # pedantic issue number requester in to docs
]
lint.per-file-ignores = {"tests*" = [
    "ANN001", # No return type annotation
    "ANN201", # No return type annotation
    "ARG001", # Unused function argument
    "D100", # Missing docstring in public module
    "D103", # Missing docstring in public function
    "ERA001", # commented code
    "INP001", # File is part of an implicit namespace package.
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "S101", # Use of `assert` detected,
]}
lint.select = ["ALL"]
lint.mccabe.max-complexity = 18
lint.pep8-naming.classmethod-decorators = ["classmethod"]

[tool.ruff.lint.isort]
known-first-party = ["config_manager", "audio_recorder", "dropbox_uploader", "gpio_controller", "web_interface"]

[tool.tomlsort]
all = true
spaces_indent_inline_array = 4
trailing_comma_inline_array = true
overrides."project.classifiers".inline_arrays = false
overrides."tool.coverage.paths.source".inline_arrays = false

