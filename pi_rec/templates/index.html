<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Recorder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            color: #444;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .status-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .status-indicator.recording {
            background-color: #e74c3c;
            animation: pulse 1.5s infinite;
        }

        .status-indicator.idle {
            background-color: #2ecc71;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        .status-text {
            font-size: 1.2em;
            color: #666;
            vertical-align: middle;
        }

        .device-info {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin-bottom: 30px;
            min-height: 1.2em; /* Prevent layout shift */
        }

        .recording-stats {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: none; /* Hidden by default */
        }

        .recording-stats.visible {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.8em;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: 600;
            color: #333;
            margin-top: 5px;
        }

        .health-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .health-indicator.healthy {
            background-color: #d4edda;
            color: #155724;
        }

        .health-indicator.warning {
            background-color: #fff3cd;
            color: #856404;
        }

        .health-indicator.error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .warnings {
            margin-top: 15px;
            padding: 10px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            display: none;
        }

        .warnings.visible {
            display: block;
        }

        .warnings-title {
            font-weight: 600;
            color: #856404;
            margin-bottom: 5px;
        }

        .warning-item {
            font-size: 0.85em;
            color: #856404;
            margin: 3px 0;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }

        button {
            padding: 12px 25px;
            font-size: 1em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            color: white;
            font-weight: 500;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-start {
            background-color: #3498db;
        }

        .btn-start:hover:not(:disabled) {
            background-color: #2980b9;
        }

        .btn-stop {
            background-color: #e74c3c;
        }

        .btn-stop:hover:not(:disabled) {
            background-color: #c0392b;
        }

        .recordings {
            margin-top: 20px;
        }

        .recordings h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #555;
        }

        .recording-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
        }

        .recording-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .recording-item:last-child {
            border-bottom: none;
        }

        .recording-item .filename {
            font-weight: 500;
            color: #34495e;
        }

        .recording-item .details {
            font-size: 0.85em;
            color: #7f8c8d;
        }

        .no-recordings {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📼 Audio Recorder</h1>

        <div class="status">
            <span class="status-indicator idle" id="statusIndicator"></span>
            <span class="status-text" id="statusText">Ready</span>
        </div>

        <div class="device-info" id="deviceInfo">
            Loading device...
        </div>

        <div class="recording-stats" id="recordingStats">
            <h3 style="text-align: center; margin-bottom: 10px; color: #555;">Recording Statistics</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Duration</div>
                    <div class="stat-value" id="statDuration">0:00</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">File Size</div>
                    <div class="stat-value" id="statFileSize">0 MB</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Queue Size</div>
                    <div class="stat-value" id="statQueue">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Overflows</div>
                    <div class="stat-value" id="statOverflows">0</div>
                </div>
            </div>
            <div style="text-align: center;">
                <div class="health-indicator healthy" id="healthIndicator">
                    ● Device Healthy
                </div>
            </div>
            <div class="warnings" id="warnings">
                <div class="warnings-title">⚠️ Warnings</div>
                <div id="warningsList"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="startRecording()">
                Start Recording
            </button>
            <button class="btn-stop" id="stopBtn" onclick="stopRecording()" disabled>
                Stop Recording
            </button>
        </div>

        <div class="recordings">
            <h2>Local Recordings</h2>
            <ul class="recording-list" id="recordingList">
                <!-- Recordings will be populated here -->
            </ul>
        </div>
    </div>

    <script>
        let isRecording = false;

        // Update status on page load and periodically
        updateStatus();
        setInterval(updateStatus, 2000);

        // Get device info on page load
        getDeviceInfo();

        // Update recordings list
        updateRecordings();
        setInterval(updateRecordings, 5000);

        async function getDeviceInfo() {
            try {
                const response = await fetch('/api/device');
                const data = await response.json();
                const deviceInfoEl = document.getElementById('deviceInfo');
                if (data.success && data.device) {
                    deviceInfoEl.textContent = `Using: ${data.device.name} @ ${data.device.default_sample_rate}Hz`;
                } else {
                    deviceInfoEl.textContent = 'Could not determine audio device.';
                }

                // Also get health info for additional details
                const healthResponse = await fetch('/api/health');
                const healthData = await healthResponse.json();
                if (healthData.device_info) {
                    const info = healthData.device_info;
                    const latencyInfo = healthData.device_latency ?
                        ` (Latency: ${healthData.device_latency.low_input_ms}ms-${healthData.device_latency.high_input_ms}ms)` : '';
                    deviceInfoEl.title = `Chunk: ${info.chunk_size} frames (~${info.chunk_duration_ms}ms)${latencyInfo}`;
                }
            } catch (error) {
                console.error('Error fetching device info:', error);
                document.getElementById('deviceInfo').textContent = 'Error fetching device info.';
            }
        }

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                isRecording = data.is_recording;

                const statusIndicator = document.getElementById('statusIndicator');
                const statusText = document.getElementById('statusText');
                const startBtn = document.getElementById('startBtn');
                const stopBtn = document.getElementById('stopBtn');
                const recordingStats = document.getElementById('recordingStats');

                if (isRecording) {
                    statusIndicator.className = 'status-indicator recording';
                    statusText.textContent = 'Recording...';
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    recordingStats.className = 'recording-stats visible';

                    // Update stats if available
                    if (data.stats) {
                        updateRecordingStats(data.stats);
                    }
                } else {
                    statusIndicator.className = 'status-indicator idle';
                    statusText.textContent = 'Ready';
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    recordingStats.className = 'recording-stats';
                }
            } catch (error) {
                console.error('Error updating status:', error);
                document.getElementById('statusText').textContent = 'Offline';
            }
        }

        function formatDuration(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateRecordingStats(stats) {
            // Update duration
            document.getElementById('statDuration').textContent =
                formatDuration(stats.duration_seconds || 0);

            // Update file size
            document.getElementById('statFileSize').textContent =
                `${stats.file_size_mb || 0} MB`;

            // Update queue size
            const queueSize = stats.queue_max_size || 0;
            document.getElementById('statQueue').textContent = queueSize;

            // Update overflows with warning color
            const overflows = stats.overflow_count || 0;
            const overflowEl = document.getElementById('statOverflows');
            overflowEl.textContent = overflows;
            if (overflows > 0) {
                overflowEl.style.color = '#e74c3c';
            } else {
                overflowEl.style.color = '#333';
            }

            // Update warnings
            const warningsEl = document.getElementById('warnings');
            const warningsListEl = document.getElementById('warningsList');

            if (stats.errors && stats.errors.length > 0) {
                warningsEl.className = 'warnings visible';
                warningsListEl.innerHTML = stats.errors
                    .map(err => `<div class="warning-item">${err}</div>`)
                    .join('');
            } else {
                warningsEl.className = 'warnings';
            }

            // Check health periodically
            checkDeviceHealth();
        }

        async function checkDeviceHealth() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                const healthIndicator = document.getElementById('healthIndicator');

                if (data.device_connected) {
                    healthIndicator.className = 'health-indicator healthy';
                    healthIndicator.textContent = '● Device Healthy';
                } else {
                    healthIndicator.className = 'health-indicator error';
                    healthIndicator.textContent = '● Device Disconnected';
                }
            } catch (error) {
                console.error('Error checking device health:', error);
            }
        }

        async function startRecording() {
            try {
                await fetch('/api/start', { method: 'POST' });
                updateStatus();
            } catch (error) {
                console.error('Error starting recording:', error);
            }
        }

        async function stopRecording() {
            try {
                await fetch('/api/stop', { method: 'POST' });
                updateStatus();
                // Give the backend a moment to write the file before refreshing the list
                setTimeout(updateRecordings, 1000);
            } catch (error) {
                console.error('Error stopping recording:', error);
            }
        }

        async function updateRecordings() {
            try {
                const response = await fetch('/api/recordings');
                const data = await response.json();
                const recordingList = document.getElementById('recordingList');

                recordingList.innerHTML = ''; // Clear existing list

                if (data.recordings && data.recordings.length > 0) {
                    data.recordings.forEach(rec => {
                        const li = document.createElement('li');
                        li.className = 'recording-item';

                        const sizeMB = (rec.size / (1024 * 1024)).toFixed(2);
                        const createdDate = new Date(rec.created).toLocaleString();

                        li.innerHTML = `
                            <span class="filename">${rec.filename}</span>
                            <span class="details">${sizeMB} MB - ${createdDate}</span>
                        `;
                        recordingList.appendChild(li);
                    });
                } else {
                    recordingList.innerHTML = '<li class="no-recordings">No recordings found.</li>';
                }
            } catch (error) {
                console.error('Error updating recordings:', error);
            }
        }
    </script>
</body>
</html>
